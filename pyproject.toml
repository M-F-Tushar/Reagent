[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reagent"
version = "0.1.0"
description = "A molecular drug-discovery platform and computer science study project"
requires-python = ">=3.11"
dependencies = [
    "pubchempy==1.0.5",
    "rdkit==2026.3.5",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
reagent-week-01 = "reagent.scripts.show_compounds:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that call a live external service",
]